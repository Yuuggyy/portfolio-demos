server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Flutter Web assets need long-lived caching and correct wasm mime
    types {
        application/wasm wasm;
    }

    error_page 404 /404.html;

    # --- Démos SPA (React Router en mode history) ---
    location = /demos/limoncello/admin {
        try_files $uri /demos/limoncello/index.html;
    }
    location = /demos/le-royal/admin {
        try_files $uri /demos/le-royal/index.html;
    }
    location = /demos/110-street/admin {
        try_files $uri /demos/110-street/index.html;
    }
    location = /demos/big-bite/admin {
        try_files $uri /demos/big-bite/index.html;
    }

    location /demos/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # fichiers versionnés
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
