server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Table MIME standard AVANT le bloc types : sans l'include, le bloc types
    # remplace la table par defaut et tout part en application/octet-stream
    # (le navigateur telecharge alors la page au lieu de l'afficher).
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        text/javascript js mjs;
    }

    error_page 404 /404.html;

    # Fichiers versionnes : cache long, jamais de fallback HTML
    location ~* \.(js|mjs|css|png|jpg|jpeg|webp|svg|ico|woff2?|wasm|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Routes SPA en mode history : on retombe sur l'index de la demo concernee
    location ~ ^/demos/(?<slug>[^/]+)/.+$ {
        try_files $uri $uri/ /demos/$slug/index.html;
    }

    location /demos/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
